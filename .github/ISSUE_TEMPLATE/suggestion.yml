name: Suggestion
description: Propose new content, a design change, or a clearer way to explain something.
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Opening an issue first means we can talk it through before anyone spends time building it.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the change and, if you can, why it would help visitors to the site.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything that prompted this. A confusing bit of copy, a comparison with another site, a question people keep asking.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on this yourself?
      options:
        - Yes, I would like to send a pull request
        - Maybe, with some guidance
        - No, just suggesting
    validations:
      required: true
