name: Copy or link fix
description: A typo, awkward wording, outdated claim or broken link.
title: "[Copy] "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for spotting this! If it is a tiny fix you are also very welcome to open a pull request directly.
  - type: input
    id: where
    attributes:
      label: Where is it?
      placeholder: Hero paragraph, second sentence
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text or link
      placeholder: Paste the text exactly as it appears.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested change
      description: Your proposed wording or the correct link, if you have one.
